# Self-test on queue `self` (ac-box). Cache identity is agent `S3_CACHE_*`.
# Docker-in-Docker: scripts/bk-docker-run.sh and scripts/ci-agent-paths.sh.
# Tag builds (vX.Y.Z) also publish imkarrer/flox-buildkite-agent to Docker Hub;
# that step needs a DOCKERHUB_TOKEN Buildkite secret on this queue.

agents:
  queue: self

steps:
  - label: ":bash: unit tests"
    command: bash scripts/bk-docker-run.sh tests

  - label: ":bash: lint"
    command: bash scripts/bk-docker-run.sh lint

  - wait

  - label: ":flox: cold start (no flox on PATH)"
    key: cold
    command: bash scripts/ci-agent-paths.sh cold

  - label: ":flox: local env"
    plugins:
      - imkarrer/flox#main:
          dir: examples/hello
          command: hello

  # FLOX_TOKEN on the agent (or floxhub-token). soft_fail if the token is missing.
  - label: ":flox: remote env"
    soft_fail: true
    plugins:
      - imkarrer/flox#main:
          environment: imkarrer/hello
          command: hello
          trust: true

  - wait

  - label: ":docker: pre-baked agent image"
    key: image
    command: bash scripts/ci-agent-paths.sh image

  - label: ":docker: publish agent image"
    key: publish
    depends_on: image
    if: build.tag != null
    command: bash scripts/ci-agent-paths.sh publish
