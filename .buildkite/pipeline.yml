# Self-test pipeline: this plugin dogfoods itself against the example
# environment in examples/hello. Point a Buildkite pipeline at this repo.
#
# Queue `self` is the ac-box agent. Unit tests/lint use Docker images;
# scripts/bk-docker-run.sh handles a containerized agent (docker.sock).

agents:
  queue: self

steps:
  - label: ":bash: unit tests"
    command: bash scripts/bk-docker-run.sh tests

  - label: ":bash: lint"
    command: bash scripts/bk-docker-run.sh lint

  - wait

  - label: ":flox: local env"
    plugins:
      - imkarrer/flox#main:
          dir: examples/hello
          command: hello

  # Needs FLOX_TOKEN on the agent (or floxhub-token here) and
  # `flox push -d examples/hello` → imkarrer/hello. soft_fail so a missing
  # or expired token never blocks the build — same as the old GHA job.
  - label: ":flox: remote env"
    soft_fail: true
    plugins:
      - imkarrer/flox#main:
          environment: imkarrer/hello
          command: hello
