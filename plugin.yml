name: Flox
description: Reproducible dev environments using Flox — install flox, activate environments, and run commands
author: https://github.com/imkarrer
requirements:
  - bash
configuration:
  properties:
    command:
      type: string
      description: Command to run inside the Flox environment
    channel:
      type: string
      default: stable
      description: Flox release channel (stable, qa, nightly, or commit hash)
    version:
      type: string
      default: ""
      description: Pin a specific flox version
    environment:
      type: string
      default: ""
      description: Remote FloxHub environment (owner/name) to activate
    dir:
      type: string
      default: ""
      description: Path to directory containing a .flox/ environment
    floxhub-token:
      type: string
      default: ""
      description: FloxHub token for authenticating remote environments
    activation-mode:
      type: string
      default: ""
      description: Activate the environment in "dev" or "run" mode (overrides options.activate.mode in the manifest)
    trust:
      type: boolean
      default: false
      description: Trust remote environments (equivalent to flox activate --trust)
    s3-cache-bucket:
      type: string
      default: ""
      description: S3-compatible Nix binary cache bucket (e.g. flox-binary-cache). Empty disables the cache.
    s3-cache-endpoint:
      type: string
      default: ""
      description: "Full S3 endpoint URL (R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com · AWS: https://s3.<region>.amazonaws.com · MinIO: https://minio.example.com:9000)"
    s3-cache-region:
      type: string
      default: auto
      description: S3 region for the cache (auto for R2)
    s3-cache-public-key:
      type: string
      default: ""
      description: Trusted Nix cache public key (cache-name-1:base64=)
    s3-cache-push:
      type: boolean
      default: false
      description: Write back (push) the activated environment's closure to the S3 cache after the step. Needs S3_CACHE_SIGNING_KEY.
    disable-metrics:
      type: boolean
      default: true
      description: Disable anonymous usage telemetry
  required:
    - command
  additionalProperties: false
