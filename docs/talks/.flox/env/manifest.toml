schema-version = "1.14.0"

# Toolchain for building the talk deck. A talk arguing that environments belong
# in the repo should not be built with an unpinned `npx ...@latest`.

[install]
marp-cli.pkg-path = "marp-cli"

# Flox's brand typeface. Pinned here so the deck renders with correct metrics
# offline; theme/flox.css also imports it from Google Fonts as a fallback.
geist-font.pkg-path = "geist-font"

# Marp shells out to a browser for PDF, PPTX, and PNG export; HTML needs none.
# Catalog chromium is Linux-only. Darwin gets catalog google-chrome (unfree)
# so PDF export does not depend on a host Chrome.app.
chromium.pkg-path = "chromium"
chromium.systems = ["aarch64-linux", "x86_64-linux"]
google-chrome.pkg-path = "google-chrome"
google-chrome.systems = ["aarch64-darwin", "x86_64-darwin"]

# The Makefile is the build. NixOS and other minimal systems don't ship
# `make`; pinning it here means `flox activate -- make serve` is the whole
# toolchain, not "Flox plus whatever your distro happened to include".
# (`flox build` with sandbox = "pure" still has Make — Nix stdenv ships it —
# so this pin is for activate, not for the Nix builder.)
gnumake.pkg-path = "gnumake"

# google-chrome is Unfree; without this the Darwin pin is refused.
[options]
allow.unfree = true

# Marp finds a browser via CHROME_PATH, not PATH. Chrome's own sandbox cannot
# nest inside the Nix builder, and there is no GPU.
[vars]
CHROME_NO_SANDBOX = "1"
CHROME_DISABLE_GPU = "1"

# `flox build project` activates this env with --skip-hook-on-activate, so
# CHROME_PATH must be set here (the on-activate hook never runs). Make writes
# in-tree; Flox only keeps $out.
#
# sandbox = "pure" is a Nix sandbox. Darwin's catalog Chrome is a real
# Chrome.app and still cannot launch there (path_service 1001). "warn" uses
# the pinned browser from this env on every system.
[build.project]
command = '''
  export CHROME_PATH="$(./resolve-chrome.sh)"
  # Marp writes conversion HTML under $HOME on Linux; Nix's /homeless-shelter
  # is not writable.
  if [ ! -w "${HOME:-}" ]; then
    export HOME="${TMPDIR:-/tmp}"
  fi
  make
  mkdir -p "$out"
  cp -r build "$out/"
'''
sandbox = "warn"

[hook]
on-activate = '''
  if _chrome="$("$FLOX_ENV_PROJECT/resolve-chrome.sh")"; then
    export CHROME_PATH="$_chrome"
  fi
  unset _chrome
'''
