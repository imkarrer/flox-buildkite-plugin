schema-version = "1.14.0"

# Toolchain for building the talk deck. A talk arguing that environments belong
# in the repo should not be built with an unpinned `npx ...@latest`.

[install]
marp-cli.pkg-path = "marp-cli"

# Flox's brand typeface. Pinned here so the deck renders with correct metrics
# offline; theme/flox.css also imports it from Google Fonts as a fallback.
geist-font.pkg-path = "geist-font"

# Marp shells out to a browser for PDF, PPTX, and PNG export; HTML needs none.
# The catalog ships chromium on Linux only (see `flox show chromium`), so it's
# scoped there and the hook falls back to a system Chrome on macOS.
chromium.pkg-path = "chromium"
chromium.systems = ["aarch64-linux", "x86_64-linux"]

# The Makefile is the build. NixOS and other minimal systems don't ship
# `make`; pinning it here means `flox activate -- make serve` is the whole
# toolchain, not "Flox plus whatever your distro happened to include".
gnumake.pkg-path = "gnumake"

[hook]
on-activate = '''
  # Marp locates a browser via CHROME_PATH. Prefer the pinned Chromium this
  # env ships on Linux; fall back to a system Chrome so macOS can still export.
  #
  # Always resolve to the physical path. Marp CLI treats any executable under
  # /mnt/<drive>/ as Windows Chrome and rewrites file:// URLs to
  # \\wsl.localhost\… — which then 404s (net::ERR_FILE_NOT_FOUND). A WSL
  # checkout on /mnt/c (Downloads, etc.) puts $FLOX_ENV/bin/chromium on that
  # prefix even though the binary is Linux, so the unresolved wrapper fools
  # the heuristic. The nix store path does not.
  #
  # Prefer the pinned binary even if CHROME_PATH is already set: WSL shells
  # often inherit a Windows Chrome path, which hits the same rewrite.
  _chrome=""
  if [ -x "$FLOX_ENV/bin/chromium" ]; then
    _chrome="$FLOX_ENV/bin/chromium"
  elif [ -z "${CHROME_PATH:-}" ]; then
    for _candidate in \
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      "/Applications/Chromium.app/Contents/MacOS/Chromium"; do
      if [ -x "$_candidate" ]; then
        _chrome="$_candidate"
        break
      fi
    done
    unset _candidate
  fi
  if [ -n "$_chrome" ]; then
    # Prefer realpath/readlink -f so a symlink inside a real .flox/run/bin
    # still lands in /nix/store. Fall back to pwd -P on the directory
    # (macOS readlink had no -f before 12.3).
    if _resolved="$(realpath "$_chrome" 2>/dev/null)" && [ -x "$_resolved" ]; then
      export CHROME_PATH="$_resolved"
    elif _resolved="$(readlink -f "$_chrome" 2>/dev/null)" && [ -x "$_resolved" ]; then
      export CHROME_PATH="$_resolved"
    else
      export CHROME_PATH="$(cd "$(dirname "$_chrome")" && pwd -P)/$(basename "$_chrome")"
    fi
    unset _resolved
  fi
  unset _chrome
'''
