      }
    },
    "hook": {
      "on-activate": "  # Marp locates a browser via CHROME_PATH. Prefer the pinned one; fall back to\n  # a system Chrome so macOS without a catalog chromium can still export.\n  if [ -z \"${CHROME_PATH:-}\" ]; then\n    for _candidate in \\\n      \"$FLOX_ENV/bin/chromium\" \\\n      \"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome\" \\\n      \"/Applications/Chromium.app/Contents/MacOS/Chromium\"; do\n      if [ -x \"$_candidate\" ]; then\n        export CHROME_PATH=\"$_candidate\"\n        break\n      fi\n    done\n    unset _candidate\n  fi\n"
    },
    "options": {}
  },
